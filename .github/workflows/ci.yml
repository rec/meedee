name: CI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native regression checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Configure device-free native tests
        run: |
          flags=()
          if [[ "$RUNNER_OS" != Windows ]]; then
            flags+=("-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer")
            flags+=("-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined")
          fi
          cmake -S third_party/libremidi -B target/native-tests \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DLIBREMIDI_TESTS=ON -DLIBREMIDI_NO_BOOST=ON \
            -DLIBREMIDI_NO_JACK=ON -DLIBREMIDI_NO_PIPEWIRE=ON \
            -DLIBREMIDI_NO_NETWORK=ON -DLIBREMIDI_NO_KEYBOARD=ON \
            -DLIBREMIDI_NO_WINMIDI=ON -DLIBREMIDI_NO_WINUWP=ON \
            -DLIBREMIDI_NO_KDMAPI=ON -DLIBREMIDI_DOWNLOAD_CPPWINRT=OFF \
            "${flags[@]}"
      - name: Build and run regression targets
        run: |
          targets=(libremidi callback_lifetime_test)
          case "$RUNNER_OS" in
            macOS) targets+=(coremidi_properties_test coremidi_teardown_test coremidi_keeper_test) ;;
            Windows) targets+=(winmm_teardown_test winmm_output_test winmm_discovery_test winmm_discovery_ansi_test) ;;
          esac
          cmake --build target/native-tests --config Debug --target "${targets[@]}" --parallel 2
          ctest --test-dir target/native-tests -C Debug --output-on-failure \
            -R '^(callback_lifetime|coremidi_properties|coremidi_teardown|coremidi_keeper|winmm_teardown|winmm_output|winmm_discovery|winmm_discovery_ansi)_test$'
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-checks-${{ matrix.os }}
          path: |
            target/native-tests/Testing/Temporary/
            target/native-tests/CMakeFiles/CMakeConfigureLog.yaml

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, macos-15-intel, windows-2022]
        python: ['3.11', '3.15']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: ${{ github.workspace }}/target/cargo-home
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.12'
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.87.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.87.0
      - name: Install CLI and supported optional integrations
        run: |
          extras=(--extra cli)
          if [[ '${{ matrix.python }}' == '3.15' ]]; then
            extras+=(--extra ufor)
          fi
          uv sync --frozen --python '${{ matrix.python }}' "${extras[@]}"
      - name: Rust checks and linked tests
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            export PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/Scripts/python.exe"
          else
            export PYO3_PYTHON="$GITHUB_WORKSPACE/.venv/bin/python"
          fi
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          # Embedded Python tests share interpreter and tracing state.
          cargo test --locked --workspace -- --test-threads=1
      - name: Python tests
        run: |
          set +e
          uv run --no-sync pytest > target/pytest.log 2>&1
          test_status=$?
          set -e
          cat target/pytest.log
          if [[ "$test_status" != 0 ]]; then
            report=$(tail -c 3500 target/pytest.log)
            report=${report//'%'/'%25'}
            report=${report//$'\r'/'%0D'}
            report=${report//$'\n'/'%0A'}
            printf '::error title=Python tests::%s\n' "$report"
          fi
          exit "$test_status"
      - run: uv run --no-sync ruff check --select B,E,F,I meedee test
      - run: uv run --no-sync ruff format --check meedee test
      - name: Type check the selected Python surface
        run: uv run --no-sync ty check --python-version '${{ matrix.python }}' meedee test
      - name: Build wheel from sdist
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          maturin-version: 'v1.15.0'
          rust-toolchain: '1.87.0'
          command: build
          args: --release --locked --sdist -i ${{ runner.os == 'Linux' && format('python{0}', matrix.python) || 'python' }} --out dist
          manylinux: '2_28'
          before-script-linux: |
            dnf install -y alsa-lib-devel
      - name: Install and test wheel outside checkout
        run: |
          uv venv "$RUNNER_TEMP/meedee-wheel" --python '${{ matrix.python }}'
          if [[ "$RUNNER_OS" == Windows ]]; then
            wheel_python="$RUNNER_TEMP/meedee-wheel/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/meedee-wheel/bin/python"
          fi
          uv pip install --python "$wheel_python" dist/*.whl pytest
          extras=(--extra cli)
          if [[ '${{ matrix.python }}' == '3.15' ]]; then
            extras+=(--extra ufor)
          fi
          uv export --frozen "${extras[@]}" --no-emit-project --no-dev --no-hashes --output-file target/wheel-optional-requirements.txt
          uv pip install --python "$wheel_python" -r target/wheel-optional-requirements.txt
          cd "$RUNNER_TEMP"
          "$wheel_python" -m pytest "$GITHUB_WORKSPACE/test/test_contract.py" "$GITHUB_WORKSPACE/test/test_packets.py" "$GITHUB_WORKSPACE/test/test_isolation.py" "$GITHUB_WORKSPACE/test/test_messages.py" "$GITHUB_WORKSPACE/test/test_codecs.py" "$GITHUB_WORKSPACE/test/test_controls.py" "$GITHUB_WORKSPACE/test/test_tuning.py" "$GITHUB_WORKSPACE/test/test_profiles.py" "$GITHUB_WORKSPACE/test/test_profile_engines.py" "$GITHUB_WORKSPACE/test/test_ump.py" "$GITHUB_WORKSPACE/test/test_files.py" "$GITHUB_WORKSPACE/test/test_archive.py" "$GITHUB_WORKSPACE/test/test_live.py" "$GITHUB_WORKSPACE/test/test_file_timing.py" "$GITHUB_WORKSPACE/test/test_event_views.py" "$GITHUB_WORKSPACE/test/test_ci.py" "$GITHUB_WORKSPACE/test/test_ufor_tuning.py"
          "$wheel_python" -m pytest \
            "$GITHUB_WORKSPACE/test/test_inspection.py" \
            "$GITHUB_WORKSPACE/test/test_note_inspection.py" \
            "$GITHUB_WORKSPACE/test/test_notes.py" \
            "$GITHUB_WORKSPACE/test/test_comparison.py" \
            "$GITHUB_WORKSPACE/test/test_cli.py" \
            "$GITHUB_WORKSPACE/test/test_monitor.py" \
            "$GITHUB_WORKSPACE/test/test_routing.py" \
            "$GITHUB_WORKSPACE/test/test_patch.py" \
            "$GITHUB_WORKSPACE/test/test_topology.py" \
            "$GITHUB_WORKSPACE/test/test_discovery.py" \
            "$GITHUB_WORKSPACE/test/test_transfer.py" \
            "$GITHUB_WORKSPACE/test/test_transfer_cli.py"
      - run: uv run --no-sync pytest test/release/artifacts.py -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meedee-${{ matrix.os }}-cp${{ matrix.python }}
          path: dist/*
