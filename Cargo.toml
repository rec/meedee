[package]
name = "meedee-python"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Python bindings for the meedee Rust MIDI toolkit"
repository = "https://github.com/rec/meedee"
publish = false
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/meedee"]
default-members = ["."]
resolver = "2"

[dependencies]
meedee = { path = "crates/meedee" }
pyo3 = "=0.29.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
meedee-coremidi-fixture = { path = "crates/meedee/tests/coremidi-fixture" }
