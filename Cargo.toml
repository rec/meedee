[package]
name = "middi-python"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Python bindings for the middi Rust MIDI toolkit"
repository = "https://github.com/rec/middi"
publish = false
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/middi"]
default-members = ["."]
resolver = "2"

[dependencies]
middi = { path = "crates/middi" }
pyo3 = "=0.29.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
middi-coremidi-fixture = { path = "crates/middi/tests/coremidi-fixture" }
