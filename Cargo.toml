[package]
name = "middy-python"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Python bindings for the middy Rust MIDI toolkit"
repository = "https://github.com/rec/middy"
publish = false
license = "MIT"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/middy"]
default-members = ["."]
resolver = "2"

[dependencies]
middy = { path = "crates/middy" }
pyo3 = "=0.29.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
middy-coremidi-fixture = { path = "crates/middy/tests/coremidi-fixture" }
