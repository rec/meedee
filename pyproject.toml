[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "middy"
dynamic = ["version"]
description = "Python bindings for the middy Rust MIDI toolkit"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2", "reccy>=0.2.0"]
license = "MIT"
license-files = ["LICENSE", "crates/middy/THIRD_PARTY_NOTICES.md", "crates/middy/third_party/libremidi/LICENSE.md"]
classifiers = [
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
ufor = ["ufor; python_version >= '3.13'"]
cli = [
    "tyro>=1.0.16",
]

[project.urls]
Repository = "https://github.com/rec/middy"
Issues = "https://github.com/rec/middy/issues"

[project.scripts]
middy = "middy.cli:main"

[dependency-groups]
dev = [
    "maturin==1.15.0",
    "pytest>=8",
    "pyupgrade>=3.19",
    "ruff>=0.11",
    "ty>=0.0.1",
]

[tool.uv.sources]
ufor = { git = "https://github.com/rec/ufor", branch = "main" }
reccy = { git = "https://github.com/rec/reccy.git", branch = "main" }

[tool.maturin]
python-source = "."
module-name = "middy._core"
locked = true

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/middy/native/**/*" },
    { file = "crates/middy/third_party/libremidi/**/*" },
    { file = "middy/*.py" },
    { file = "middy/*.pyi" },
    { file = "middy/py.typed" },
    { file = "README.md" },
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
target-version = "py313"

[tool.ty.environment]
python-version = "3.13"
